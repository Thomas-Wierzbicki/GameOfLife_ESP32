[env:ttgo_dual_tx]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.1
    jgromes/RadioLib @ ^7.6.0
build_flags = -D TTGO_DUAL_TX
build_src_filter = +<ttgo_dual/main.cpp>
monitor_speed = 115200

[env:ttgo_dual_rx]
extends = env:ttgo_dual_tx
build_flags = -D TTGO_DUAL_RX

[env:heltec_v2_dual_tx]
extends = env:ttgo_dual_tx
board = heltec_wifi_lora_32_V2
build_flags = -D TTGO_DUAL_TX -D LIFE_HELTEC_V2

[env:heltec_v2_dual_rx]
extends = env:heltec_v2_dual_tx
build_flags = -D TTGO_DUAL_RX -D LIFE_HELTEC_V2
