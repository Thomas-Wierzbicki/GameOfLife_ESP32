[env:heltec_frame_tx]
extends = env:diymore_lora_v4
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.1
    jgromes/RadioLib @ ^7.6.0
build_flags =
    ${env:diymore_lora_v4.build_flags}
    -D LIFE_FRAME_TX
build_src_filter = +<life_frame.cpp>

[env:heltec_frame_rx]
extends = env:heltec_frame_tx
build_flags =
    ${env:diymore_lora_v4.build_flags}
    -D LIFE_FRAME_RX
