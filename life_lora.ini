[env:heltec_life_tx]
extends = env:diymore_lora_v4
lib_deps =
    ${env:diymore_lora_v4.lib_deps}
    jgromes/RadioLib @ ^7.6.0
build_flags =
    ${env:diymore_lora_v4.build_flags}
    -D LIFE_TX
build_src_filter = +<life_link.cpp>

[env:heltec_life_rx]
extends = env:heltec_life_tx
build_flags =
    ${env:diymore_lora_v4.build_flags}
    -D LIFE_RX
